manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: lreimer/taxi-callcenter-agents
    source: https://github.com/lreimer/taxi-callcenter-agents
    branch: main
    commit: "477468a1"
    scope: [simple-taxi-agent/agent.py, weather_time_agent/agent.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:56:54Z'
    url: https://a2as.org/certified/agents/lreimer/taxi-callcenter-agents
  signatures:
    digest: sha256:ScyUblGcfSqKbUJmU7WwLwAWNgbTo8iZUceQEWFPE5Y
    key: ed25519:tbfYdqZ-6KLBm1bRl5b-pBhJX42e0Pc9RJaGIIYi9Eo
    sig: ed25519:gwx3flM4BsMf4sEGwpHB-YgWGymure87H-tCTnt1FW9AMKczWBrz24_-RTiATgiE2Bim8i8-SE-Dibwme5rfCA

agents:
  root_agent.0:
    type: instance
    models: [gemini-2.0-flash-live-001]
    tools: [get_weather, get_current_time]
    params:
      name: weather_time_agent
      description: Agent to answer questions about the time and weather in a city.
      instruction: [You are a helpful agent who can answer user questions about the time and weather in a city.]
      instance: root_agent
  root_agent.1:
    type: instance
    models: [gemini-2.0-flash-live-001]
    tools: [tools]
    mcp: [tools]
    params:
      name: simple_taxi_agent
      description: Agent to help with ordering a taxi.
      instruction: ['You are a helpful, friendly call center agent that can assist users in ordering a taxi.', 'Your personality
          is polite, professional and reliable.', 'Company information:', '- Taxi Service Inntaxi', '- Managing Director:
          Paulo Machado', '- Location: Rosenheim, Germany', '- Opening hours: 24/7', '- Webseite: www.inn-taxi.de', Your customers
          want to order a taxi in the city of Rosenheim in Germany., Your customers are English speakers and you should respond
          in English., 'You start the conversation with ‘This is Inn taxi service, how can I help you?’', It is okay to ask
          the customer questions., Use the available tools and functions generously., Repeat the caller's instructions and
          confirm that you have understood them., 'Stick to the information available to you, don''t make up information.',
        The phone number of the caller and passenger is '+49 0800 1234567'., 'You can use the following tools to assist you
          in your tasks:', '- verify_address: Verify if the pickup address (street, city) exists and is valid.', '- check_availability:
          Check if a taxi is available at a given address (street, city).', '- dispatch_taxi: Order and dispatch a taxi for
          the caller.', 'To book a taxi you need to ask and determine several details:', '- Ask for the caller (passenger)
          name', '- Ask for the pick-up address, made up of street and city', '- Verify the address using the provided tool,
          if not valid, ask for the address again', '- Ask for the pick-up time', '- Ask for additional information: number
          of passengers, child seats, luggage', '- Check the taxi availability using provided tools', '- If a taxi is available,
          continue with the booking process', '- If a taxi is not available, inform the caller', '- Before placing the order,
          repeat the information and ask for confirmation of the booking. Yes or no as answer.', '- Dispatch the taxi using
          provided tool dispatch_taxi when the caller confirms', '- If the caller does not confirm, ask for the reason and
          try to resolve it', '- After successful dispatch, provide the estimated time of arrival', '- Close the conversion
          friendly']
      function: get_agent_async
      instance: root_agent

models:
  gemini-2.0-flash-live-001:
    type: literal
    agents: [root_agent.0, root_agent.1]

tools:
  get_current_time:
    type: function
    agents: [root_agent.0]
    params:
      description: |-
        Returns the current time in a specified city.

        Args:
            city (str): The name of the city for which to retrieve the current time.

        Returns:
            dict: status and result or error msg.
  get_weather:
    type: function
    agents: [root_agent.0]
    params:
      description: |-
        Retrieves the current weather report for a specified city.

        Args:
            city (str): The name of the city for which to retrieve the weather report.

        Returns:
            dict: status and result or error msg.
  tools:
    type: mcp
    agents: [root_agent.1]
    mcp: [tools]
    params:
      dynamic: "True"
      mcp_source: tools

mcp:
  tools:
    type: network
    url: http://localhost:8001/sse
    agents: [root_agent.1]
    params:
      class: MCPToolset
      method: from_server
      connection_type: SseServerParams

imports:
  agent: agent
  Agent: google.adk.agents.Agent
  datetime: datetime
  dotenv: dotenv
  MCPToolset: google.adk.tools.mcp_tool.mcp_toolset.MCPToolset
  os: os
  SseServerParams: google.adk.tools.mcp_tool.mcp_toolset.SseServerParams
  ZoneInfo: zoneinfo.ZoneInfo

functions:
  get_agent_async:
    type: async
    module: simple-taxi-agent.agent
  get_current_time:
    type: sync
    module: weather_time_agent.agent
    args: [city]
    params:
      returns: dict
  get_tools_async:
    type: async
    module: simple-taxi-agent.agent
  get_weather:
    type: sync
    module: weather_time_agent.agent
    args: [city]
    params:
      returns: dict

variables:
  MCP_SERVER_URL:
    type: env
    params:
      caller: [os.getenv]
      path: [simple-taxi-agent.agent]

networks:
  localhost:
    type: api
    actions: [connect]
    urls: [/sse]
    protocols: [http]
    ports: ["8001"]
    params:
      caller: [from_server]
      links: [MCPToolset]
